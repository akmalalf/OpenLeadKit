name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openleadkit_app
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: openleadkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openleadkit_app -d openleadkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_NAME: OpenLeadKit
      APP_ENV: test
      APP_DEBUG: "false"
      APP_TIMEZONE: UTC
      APP_CONTACT_URL: https://github.com/akmalalf/OpenLeadKit
      DATABASE_URL: postgresql+psycopg://openleadkit_app:ci-test-password@127.0.0.1:5432/openleadkit
      TEST_DATABASE_URL: postgresql+psycopg://openleadkit_app:ci-test-password@127.0.0.1:5432/openleadkit_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Prepare PostgreSQL
        run: |
          until pg_isready -h 127.0.0.1 -U openleadkit_app -d openleadkit_test; do sleep 1; done
          PGPASSWORD=ci-test-password psql -h 127.0.0.1 -U openleadkit_app -d openleadkit_test \
            -c "CREATE EXTENSION IF NOT EXISTS citext" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
      - run: DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy openleadkit scripts
      - run: pytest --cov=openleadkit --cov-report=term-missing --cov-report=xml --cov-fail-under=80
