name: Bug report
description: Report a reproducible problem without including sensitive data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, `.env`, workbooks, or private business data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OpenLeadKit, Python, PostgreSQL, and OS/WSL versions.
    validations:
      required: true
